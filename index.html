<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sushi MAKAO | Redes, pedidos y rifa</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7c52b;
      color: #2b1309;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      border: 4px solid #421b0d;
    }

    .logo {
      width: 180px;
      max-width: 75%;
      border-radius: 50%;
      margin-bottom: 14px;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: 30px;
      color: #421b0d;
      font-weight: 900;
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 16px;
      color: #5b3525;
      line-height: 1.4;
    }

    .button {
      display: block;
      margin: 13px 0;
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .button:hover {
      transform: scale(1.02);
      opacity: 0.92;
    }

    .raffle {
      background: linear-gradient(45deg, #f7c52b, #f59e0b);
      color: #421b0d;
      border: 2px solid #421b0d;
      box-shadow: 0 6px 14px rgba(247, 197, 43, 0.35);
    }

    .raffle::before {
      content: "🎟️ ";
    }

    .facebook {
      background: #1877f2;
    }

    .instagram {
      background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
    }

    .tiktok {
      background: #111111;
    }

    .whatsapp {
      background: #25d366;
    }

    .maps {
      background: #4285f4;
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      color: #6b4b3d;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <img src="logo.png" alt="Logo de Sushi MAKAO" class="logo">

      <h1>Sushi MAKAO</h1>
      <p class="subtitle">
        Síguenos, escríbenos, compra tu boleto de rifa o encuentra nuestra ubicación
      </p>

      <a 
        class="button raffle"
        href="https://wa.me/593963519574?text=Hola%2C%20quiero%20comprar%20un%20boleto%20para%20la%20rifa%20por%20causa%20acad%C3%A9mica."
        target="_blank"
        rel="noopener"
      >
        Comprar boleto de rifa
      </a>
      
      <a 
        class="button facebook" 
        href="https://web.facebook.com/profile.php?id=61563958467436" 
        target="_blank" 
        rel="noopener"
      >
        Facebook
      </a>

      <a 
        class="button instagram" 
        href="https://www.instagram.com/makao_foo.d/" 
        target="_blank" 
        rel="noopener"
      >
        Instagram
      </a>

      <a 
        class="button tiktok" 
        href="https://www.tiktok.com/@makao.food" 
        target="_blank" 
        rel="noopener"
      >
        TikTok
      </a>

      <a 
        class="button whatsapp" 
        href="https://wa.me/593969009081?text=Hola%20Sushi%20MAKAO%2C%20quiero%20hacer%20un%20pedido" 
        target="_blank" 
        rel="noopener"
      >
        WhatsApp
      </a>

      <a 
        class="button maps" 
        href="https://maps.app.goo.gl/rrVBQ5oKkc5YKPCL6" 
        target="_blank" 
        rel="noopener"
      >
        Ubicación en Google Maps
      </a>

      <p class="footer">Sushi MAKAO Restaurante & Delivery</p>
    </section>
  </main>
</body>
</html>
